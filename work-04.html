            <p class="detail-block__text">縦組みの明朝体で和の格と静けさを演出した。メイン写真を全面に敷き、下部の4枚のサムネイルで「見どころの多さ」を補足している。「季節を味わう」は装飾罫で囲んで写真に埋もれないよう独立させた。あえて大きな余白を残し、要素を詰め込まないことでシンプルというコンセプトを画面構成そのもので表現している。</p>
